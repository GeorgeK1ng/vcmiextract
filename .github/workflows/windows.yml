name: Build Windows package

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: msvc-x64
            os: windows-2022
            architecture: x64
            toolset: v142
            triplet: x64-windows-static
          - platform: msvc-x86
            os: windows-2022
            architecture: Win32
            toolset: v142
            triplet: x86-windows-static
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: VCPKG
      if: ${{ startsWith(matrix.platform, 'msvc') }}
      run: vcpkg.exe install zlib libpng liblzma --triplet '${{matrix.triplet}}'

    - name: Configure
      run: cmake -S . -B ./build -A '${{matrix.architecture}}' -T '${{matrix.toolset}}' -DCMAKE_BUILD_TYPE=Release --toolchain="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET='${{matrix.triplet}}'

    - name: Build
      run: cmake --build ./build --config Release

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: vcmiextract-windows-${{ matrix.architecture }}.zip
        compression-level: 9
        path: ./build/Release/vcmiextract.exe
